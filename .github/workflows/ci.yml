name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que el codigo compila
        run: python -m compileall -q main.py api core schemas utils

      - name: Verificar que la aplicacion se puede importar
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: gestion_vehiculos_ci
        run: |
          python - <<'PY'
          from main import app

          rutas = sorted(
              f"{','.join(sorted(r.methods))} {r.path}"
              for r in app.routes
              if hasattr(r, "methods")
          )

          print(f"Aplicacion cargada correctamente: {len(rutas)} rutas")
          for ruta in rutas:
              print("  ", ruta)
          PY

